# fly volumes create aiuc_data --size 1
# fly secrets set SECRET_KEY=$(openssl rand -hex 32) ADMIN_SECRET=... LEMONSQUEEZY_WEBHOOK_SECRET=... WEB_ORIGINS=https://aiusage.dev
# fly deploy --config api/fly.toml --dockerfile api/Dockerfile
app = "aiuc-api"
primary_region = "iad"

[mounts]
  source = "aiuc_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
