name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mac jobs cost 10x the minutes of Linux/Windows, so they only run when asked:
  # Actions → CI → Run workflow → tick "Build for Mac".
  workflow_dispatch:
    inputs:
      mac:
        description: Build for Mac
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aiuc-core

  desktop:
    name: Desktop app build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      - run: npm ci --prefix app
      - name: Build unsigned bundles
        working-directory: app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows-latest
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
          if-no-files-found: warn

  desktop-mac:
    name: Desktop app build (macOS universal)
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aiuc-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      - run: npm ci --prefix app
      - name: Build unsigned bundles
        working-directory: app
        run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-macos-latest
          path: target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  desktop-linux-check:
    name: Desktop app compile check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui && npm run build --prefix ui
      - run: cargo check -p aiuc-app
      - run: cargo test -p aiuc-app --lib

  ui:
    name: Widget UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      # Every view and scenario renders without errors or overflow; main flows click through.
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run test:e2e
        working-directory: ui
        env:
          CI: "1"

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix api
      - run: npm run typecheck --prefix api
      - run: npm test --prefix api

  web:
    name: Website, calculator and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
